
; PlatformIO — EGH456 TM4C1294 (macOS laptop)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lptm4c1294ncpdt

[env:lptm4c1294ncpdt]
platform = titiva
board = lptm4c1294ncpdt
board_build.ldscript = src/platformio_linker.ld

; TM4C129 LaunchPad ICDI (USB). PlatformIO auto-detects the port on
; Windows; uncomment + set upload_port / monitor_port only if needed.
monitor_speed = 115200

; TivaWare path on this Windows machine. Teammates on macOS: change
; back to ${PROJECT_DIR}/../../TivaWare_C_Series-2.2.0.295.
build_flags =
   -mfpu=fpv4-sp-d16
   -mfloat-abi=softfp
   -I /ti/TivaWare_C_Series-2.2.0.295
   -I /ti/TivaWare_C_Series-2.2.0.295/third_party/FreeRTOS/include
   -I /ti/TivaWare_C_Series-2.2.0.295/third_party/FreeRTOS/portable/GCC/ARM_CM4F
   -Wl,--entry=ResetISR
   -DPART_TM4C1294NCPDT
   -DTARGET_IS_TM4C129_RA2
   -L lib/motorlib
   -l libmotorlib.a
   -I lib/motorlib
