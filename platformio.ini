; PlatformIO Project Configuration File for the Assignment.
;
; Source layout:
;   src/                — main.c, shared.h
;   src/tasks/          — motor_task.c, sensor_task.c, gui_task.c, fault_task.c
;   src/gui/            — gui_main.c, gui_plots.c
;   src/drivers/        — motor_driver, speed_sensor, power_sensor,
;                          opt3001, i2cOptDriver, sht31, bmi160,
;                          Kentec320x240x16_ssd2119_spi, rtos_hw_drivers
;   src/driver_lib/     — TivaWare driverlib (gpio, adc, pwm, ssi, i2c, ...)
;   src/rtos/           — FreeRTOS kernel (heap_4, queue, tasks, timers, etc.)
;   src/utils/          — uartstdio, ustdlib
;   lib/grlib/          — TivaWare graphics library
;   lib/motorlib/       — supplied BLDC commutation library (libmotorlib.a)

[env:lptm4c1294ncpdt]
platform = titiva
board = lptm4c1294ncpdt
board_build.ldscript = src/platformio_linker.ld
monitor_speed = 115200
build_flags =
   -mfpu=fpv4-sp-d16 -mfloat-abi=softfp -I /ti/TivaWare_C_Series-2.2.0.295
   -I /ti/TivaWare_C_Series-2.2.0.295/third_party/FreeRTOS/include
   -I /ti/TivaWare_C_Series-2.2.0.295/third_party/FreeRTOS/portable/GCC/ARM_CM4F
   -I src
   -Wl,--entry=ResetISR
   -DPART_TM4C1294NCPDT
   -DTARGET_IS_TM4C129_RA2
   -Lsrc
   -L lib/motorlib
   -l libmotorlib.a
