<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="hw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="motor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </linearGradient>
    <linearGradient id="sensor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="gui" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Title -->
  <text x="960" y="72" text-anchor="middle" fill="#f8fafc" font-size="42" font-weight="700">EGH456 Electric Vehicle  Motor Control System</text>
  <text x="960" y="108" text-anchor="middle" fill="#94a3b8" font-size="22">Group demonstration | TM4C1294 + DRV8323 + FreeRTOS</text>

  <!-- Hardware layer -->
  <rect x="60" y="140" width="1800" height="200" rx="16" fill="url(#hw)" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="175" fill="#e2e8f0" font-size="20" font-weight="600">HARDWARE</text>

  <rect x="100" y="195" width="200" height="120" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="200" y="230" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">TM4C1294</text>
  <text x="200" y="255" text-anchor="middle" fill="#94a3b8" font-size="13">120 MHz MCU</text>
  <text x="200" y="278" text-anchor="middle" fill="#94a3b8" font-size="13">UART0 plot</text>

  <rect x="340" y="195" width="200" height="120" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="440" y="230" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">DRV8323</text>
  <text x="440" y="255" text-anchor="middle" fill="#94a3b8" font-size="13">3-phase PWM</text>
  <text x="440" y="278" text-anchor="middle" fill="#94a3b8" font-size="13">nFAULT monitor</text>

  <rect x="580" y="195" width="220" height="120" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="690" y="230" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">BLY172S Motor</text>
  <text x="690" y="255" text-anchor="middle" fill="#94a3b8" font-size="13">4000 RPM rated</text>
  <text x="690" y="278" text-anchor="middle" fill="#94a3b8" font-size="13">Hall A/B/C feedback</text>

  <rect x="840" y="195" width="200" height="120" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="940" y="230" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Current sense</text>
  <text x="940" y="255" text-anchor="middle" fill="#94a3b8" font-size="13">ADC1 @ 1 kHz</text>
  <text x="940" y="278" text-anchor="middle" fill="#94a3b8" font-size="13">Power (W)</text>

  <rect x="1080" y="195" width="240" height="120" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="1200" y="225" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">I2C sensors</text>
  <text x="1200" y="250" text-anchor="middle" fill="#94a3b8" font-size="12">BMI160 accel</text>
  <text x="1200" y="270" text-anchor="middle" fill="#94a3b8" font-size="12">OPT3001 lux</text>
  <text x="1200" y="290" text-anchor="middle" fill="#94a3b8" font-size="12">SHT31 / BME280</text>

  <rect x="1360" y="195" width="220" height="120" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="1470" y="230" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Touch LCD</text>
  <text x="1470" y="255" text-anchor="middle" fill="#94a3b8" font-size="13">START / STOP</text>
  <text x="1470" y="278" text-anchor="middle" fill="#94a3b8" font-size="13">RPM slider, thresholds</text>

  <rect x="1620" y="195" width="200" height="120" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="1720" y="230" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">USB serial</text>
  <text x="1720" y="255" text-anchor="middle" fill="#94a3b8" font-size="13">115200 baud</text>
  <text x="1720" y="278" text-anchor="middle" fill="#94a3b8" font-size="13">Live CSV plot</text>

  <!-- HW arrows -->
  <line x1="300" y1="255" x2="340" y2="255" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="255" x2="580" y2="255" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="315" x2="690" y2="380" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FreeRTOS layer -->
  <text x="90" y="400" fill="#e2e8f0" font-size="20" font-weight="600">FREERTOS SOFTWARE</text>

  <!-- GUI -->
  <rect x="80" y="420" width="280" height="200" rx="12" fill="url(#gui)" filter="url(#shadow)"/>
  <text x="220" y="455" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">GUI Task</text>
  <text x="220" y="485" text-anchor="middle" fill="#e9d5ff" font-size="13">Touchscreen UI</text>
  <text x="220" y="510" text-anchor="middle" fill="#e9d5ff" font-size="13">RPM slider � command queue</text>
  <text x="220" y="535" text-anchor="middle" fill="#e9d5ff" font-size="13">START / STOP / ACK</text>
  <text x="220" y="560" text-anchor="middle" fill="#e9d5ff" font-size="13">Thresholds (power, accel)</text>
  <text x="220" y="595" text-anchor="middle" fill="#ddd6fe" font-size="12">Status: green / orange / yellow / red</text>

  <!-- Motor -->
  <rect x="420" y="380" width="520" height="280" rx="12" fill="url(#motor)" filter="url(#shadow)"/>
  <text x="680" y="415" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">MOTOR TASK (100 Hz)</text>
  <text x="680" y="445" text-anchor="middle" fill="#ffedd5" font-size="14">State machine + open-loop PWM control</text>

  <!-- State machine mini -->
  <rect x="450" y="465" width="460" height="170" rx="8" fill="#7c2d12" fill-opacity="0.5" stroke="#fdba74"/>
  <text x="680" y="490" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">State machine</text>
  <circle cx="500" cy="540" r="28" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <text x="500" y="545" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">IDLE</text>
  <circle cx="600" cy="540" r="28" fill="#eab308" stroke="#fff" stroke-width="2"/>
  <text x="600" y="545" text-anchor="middle" fill="#1e293b" font-size="9" font-weight="600">START</text>
  <circle cx="700" cy="540" r="28" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <text x="700" y="545" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">RUN</text>
  <circle cx="800" cy="540" r="28" fill="#f97316" stroke="#fff" stroke-width="2"/>
  <text x="800" y="545" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">STOP</text>
  <circle cx="860" cy="600" r="28" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <text x="860" y="598" text-anchor="middle" fill="#fff" font-size="8" font-weight="600">E-STOP</text>
  <circle cx="760" cy="600" r="28" fill="#991b1b" stroke="#fff" stroke-width="2"/>
  <text x="760" y="598" text-anchor="middle" fill="#fff" font-size="8" font-weight="600">LATCH</text>

  <path d="M528,540 L572,540" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M628,540 L672,540" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M728,540 L772,540" stroke="#fff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700,568 L700,572 L760,572" stroke="#fff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="680" y="625" text-anchor="middle" fill="#fed7aa" font-size="12">Ramp: 500 RPM/s up | 1000 RPM/s stop | ACK clears fault</text>

  <!-- Speed task -->
  <rect x="980" y="420" width="200" height="100" rx="10" fill="#b45309" stroke="#fdba74"/>
  <text x="1080" y="455" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Speed Task</text>
  <text x="1080" y="480" text-anchor="middle" fill="#ffedd5" font-size="12">Hall ISRs � RPM</text>
  <text x="1080" y="500" text-anchor="middle" fill="#ffedd5" font-size="12">100 Hz integrate</text>

  <!-- Sensor -->
  <rect x="980" y="540" width="360" height="120" rx="12" fill="url(#sensor)" filter="url(#shadow)"/>
  <text x="1160" y="575" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Sensor Task (50 Hz)</text>
  <text x="1160" y="605" text-anchor="middle" fill="#cffafe" font-size="13">Power, lux, accel, temp  sets E-stop event bits</text>
  <text x="1160" y="630" text-anchor="middle" fill="#cffafe" font-size="13">Debounced power E-stop after soft-start</text>

  <!-- Plot -->
  <rect x="1380" y="420" width="220" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="1490" y="455" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="600">Serial Plot Task</text>
  <text x="1490" y="480" text-anchor="middle" fill="#94a3b8" font-size="12">CSV @ 50 Hz to USB</text>
  <text x="1490" y="500" text-anchor="middle" fill="#94a3b8" font-size="12">Web Serial Plotter</text>

  <!-- Fault -->
  <rect x="1380" y="540" width="220" height="80" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="1490" y="575" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="600">Fault Task</text>
  <text x="1490" y="600" text-anchor="middle" fill="#94a3b8" font-size="12">UART fault logging</text>

  <!-- Inter-task arrows -->
  <path d="M360,520 L420,480" stroke="#c4b5fd" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="375" y="490" fill="#c4b5fd" font-size="11">commands</text>

  <path d="M360,560 L420,560" stroke="#7dd3fc" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="365" y="555" fill="#7dd3fc" font-size="11">events</text>

  <path d="M940,500 L980,470" stroke="#fdba74" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="945" y="485" fill="#fdba74" font-size="11">RPM</text>

  <path d="M1160,540 L940,580" stroke="#22d3ee" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1020" y="555" fill="#22d3ee" font-size="11">E-stop bits</text>

  <path d="M680,660 L680,720" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Control loop box -->
  <rect x="60" y="720" width="1100" height="300" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="755" fill="#f8fafc" font-size="20" font-weight="600">MOTOR CONTROL LOOP (what the plot shows)</text>

  <rect x="100" y="780" width="150" height="90" rx="8" fill="#312e81" stroke="#818cf8"/>
  <text x="175" y="815" text-anchor="middle" fill="#e0e7ff" font-size="14" font-weight="600">Desired RPM</text>
  <text x="175" y="840" text-anchor="middle" fill="#a5b4fc" font-size="12">from slider</text>

  <text x="270" y="830" fill="#94a3b8" font-size="24">�</text>

  <rect x="300" y="780" width="170" height="90" rx="8" fill="#713f12" stroke="#fbbf24"/>
  <text x="385" y="815" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="600">Reference RPM</text>
  <text x="385" y="840" text-anchor="middle" fill="#fde68a" font-size="12">500 RPM/s ramp</text>

  <text x="490" y="830" fill="#94a3b8" font-size="24">�</text>

  <rect x="520" y="780" width="170" height="90" rx="8" fill="#7c2d12" stroke="#fb923c"/>
  <text x="605" y="815" text-anchor="middle" fill="#ffedd5" font-size="14" font-weight="600">Duty %</text>
  <text x="605" y="840" text-anchor="middle" fill="#fed7aa" font-size="12">open-loop map</text>

  <text x="710" y="830" fill="#94a3b8" font-size="24">�</text>

  <rect x="740" y="780" width="150" height="90" rx="8" fill="#1e3a5f" stroke="#38bdf8"/>
  <text x="815" y="815" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="600">DRV8323</text>
  <text x="815" y="840" text-anchor="middle" fill="#7dd3fc" font-size="12">PWM output</text>

  <text x="910" y="830" fill="#94a3b8" font-size="24">�</text>

  <rect x="940" y="780" width="150" height="90" rx="8" fill="#14532d" stroke="#4ade80"/>
  <text x="1015" y="815" text-anchor="middle" fill="#dcfce7" font-size="14" font-weight="600">Motor</text>
  <text x="1015" y="840" text-anchor="middle" fill="#86efac" font-size="12">spins</text>

  <!-- Feedback -->
  <path d="M1015,870 Q1015,950 605,950 Q200,950 175,870" stroke="#4ade80" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="605" y="970" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="600">Hall feedback � Actual RPM (measured, filtered)</text>

  <!-- Plot channels -->
  <rect x="1200" y="720" width="660" height="300" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="1230" y="755" fill="#7dd3fc" font-size="20" font-weight="600">UART plot channels (115200)</text>
  <text x="1230" y="790" fill="#94a3b8" font-size="14">sample_number, desired_rpm, reference_rpm, actual_rpm,</text>
  <text x="1230" y="815" fill="#94a3b8" font-size="14">duty_percent, power_milliwatts, light_lux,</text>
  <text x="1230" y="840" fill="#94a3b8" font-size="14">acceleration_millig, hall_display_rpm</text>

  <rect x="1230" y="870" width="600" height="120" rx="8" fill="#1e293b"/>
  <text x="1250" y="900" fill="#22c55e" font-size="13" font-family="monospace">7358,1400,1400,1600,35,0,0,0,2083</text>
  <text x="1250" y="930" fill="#64748b" font-size="12">Example CSV line during RUNNING @ ~1400 RPM setpoint</text>
  <text x="1250" y="965" fill="#fbbf24" font-size="12">Demo: show reference ramp + actual tracking on Web Serial Plotter</text>

  <!-- Footer -->
  <text x="960" y="1055" text-anchor="middle" fill="#64748b" font-size="14">EGH456 Group 456 | Assignment 2.1 Motor + 2.2 Sensors + 2.3 GUI | Safety E-stop: power + acceleration</text>
</svg>
